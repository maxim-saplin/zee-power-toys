name: zee_power_toys
description: "Zeekr DHU head-unit app — HUD + touchscreen"
publish_to: none
version: 1.1.0+12

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  shared_preferences: ^2.2.3
  desktop_multi_window: ^0.3.1
  meta: ^1.9.0
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.6.0
  path_provider: ^2.1.6
  audioplayers: ^6.8.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/speedcam_sting.wav
    - assets/sounds/speedcam_alien_ping.wav
