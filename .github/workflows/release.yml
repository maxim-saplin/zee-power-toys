# Publish platform-signed APK as zee-power-toys.apk on tag 1.0.0+N (or v1.0.0+N).
# Uses committed android/tools/zeekr/androiddebugkey.jks (public AOSP debug key; no secret).
name: release
on:
  push:
    tags:
      - '1.0.0+*'
      - 'v1.0.0+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create/attach (e.g. 1.0.0+6) — optional for dispatch'
        required: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Assert in-repo AOSP platform keystore
        run: |
          set -euo pipefail
          DEST="android/tools/zeekr/androiddebugkey.jks"
          test -s "$DEST"
          echo "Using committed keystore ($DEST, $(wc -c < "$DEST") bytes)"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build car-ready release APK (AOSP platform key)
        run: flutter build apk --release -PuseAospDebugKey=true
      - name: Rename APK for self-update contract
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/zee-power-toys.apk
      - name: Upload Release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/zee-power-toys.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
