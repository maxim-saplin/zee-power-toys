# Publish platform-signed APK as zee-power-toys.apk on tag MAJOR.MINOR.PATCH+BUILD (e.g. 1.2.3+35).
# Uses committed android/tools/zeekr/androiddebugkey.jks (public AOSP debug key; no secret).
name: release
on:
  push:
    tags:
      # Any release tag (MAJOR.MINOR.PATCH+BUILD, optionally v-prefixed).
      # Replaces the per-version enumerated list that silently skipped new
      # versions (1.2.6+41 did not fire, 2026-11-20). NOTE: in Actions filter
      # syntax `+` is a quantifier, not a literal — match on the digit prefix.
      - '[0-9]*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create/attach (e.g. 1.2.3+35) — optional for dispatch'
        required: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin: runner stable moved to 3.48+, which deprecates
          # package:flutter/material.dart (material_ui migration — 0132) and
          # failed analyze repo-wide. Keep in sync with the local toolchain.
          flutter-version: 3.47.8
      - run: uv run --script dev/test_zee_drive.py
      - name: Assert in-repo AOSP platform keystore
        run: |
          set -euo pipefail
          DEST="android/tools/zeekr/androiddebugkey.jks"
          test -s "$DEST"
          echo "Using committed keystore ($DEST, $(wc -c < "$DEST") bytes)"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build car-ready release APK (AOSP platform key)
        run: flutter build apk --release -PuseAospDebugKey=true
      - name: Rename APK for self-update contract
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/zee-power-toys.apk
      - name: Upload Release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/zee-power-toys.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
