# Push CI on main — analyze + test (no APK / no Release).
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: uv run --script dev/test_zee_drive.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
